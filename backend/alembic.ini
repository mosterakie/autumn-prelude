# Alembic configuration (skeleton created in stage A1; first revisions in A3/A4).
#
# NOTE: alembic.ini is read by configparser with the OS locale encoding, so this
# file must stay ASCII-only. Detailed notes live in alembic/env.py.
#
# The database URL is intentionally empty here: alembic/env.py injects it from
# AUTUMN_DATABASE_URL so that no credentials enter version control.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# Version file names carry a UTC timestamp so ordering stays comparable.
# NOTE: "timezone" is a file_template placeholder argument, not an ini option;
# setting it here makes Alembic fail with "Can't locate timezone: UTC".
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os
# NOTE: autogenerate output is NOT auto-formatted here. The previous
# console_scripts hook resolved entry points from the current interpreter and
# failed with "Could not find entrypoint console_scripts.ruff" even inside the
# venv. Run it explicitly after generating a revision:
#   .venv\Scripts\python.exe -m ruff format alembic/versions
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
