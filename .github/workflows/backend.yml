# 后端阶段闸门（GitHub Actions）。
#
# 位于仓库根的 .github/workflows/，提交到远端后 GitHub 才执行。
#
# 与本地 `backend/scripts/ci.ps1` 等价：同一条闸门路径，避免"本地绿、CI 红"。
# 关键点：
#   - 使用 pgvector 官方镜像作为 service，并按实施顺序要求跑**真实 PostgreSQL**；
#   - 先 `upgrade head`（空库）再 `alembic check`，两者都不通过直接失败；
#   - `alembic check` 不覆盖 CHECK 表达式与触发器（评审 D7），
#     因此 catalog 核对与约束探针都在测试步骤内执行。

name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AUTUMN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5442/autumn_ci
      AUTUMN_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5442/autumn_ci
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 建 CI 数据库并启用 pgvector
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5442 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE autumn_ci'
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5442 -U postgres -d autumn_ci \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: 空库 base -> head
        run: alembic upgrade head

      - name: alembic check（不覆盖 CHECK 与触发器）
        run: alembic check

      - name: pytest（unit / integration / concurrency）
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest.xml

      - name: 约束探针（原生 SQL 独立复核）
        run: python scripts/probe_constraints.py

      - name: ruff check
        run: python -m ruff check src tests scripts alembic --output-format=concise

      - name: ruff format --check
        run: python -m ruff format --check src tests scripts alembic

      - name: mypy
        run: python -m mypy
